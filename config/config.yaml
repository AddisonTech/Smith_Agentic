# smith_agentic/config/config.yaml
# ─────────────────────────────────────────────────────────
# Per-crew model assignments are in the [crew_models] section below.
# CLI --model overrides the crew default for that run only.
# ─────────────────────────────────────────────────────────

llm:
  base_url: http://localhost:11434
  temperature: 0.7
  timeout: 600                # 14B models need more time - increase if timing out

# ── Per-crew model assignments ────────────────────────────────────────────────
# Change a model here to swap it for every future run of that crew.
# Any tag from `ollama list` works.
crew_models:
  default: qwen2.5-coder:7b
  safety:  llama3.1:8b
  ops:     llama3.1:8b
  plc:     qwen2.5:7b
  react:   qwen2.5-coder:7b
  vision:  qwen2.5:7b

# ── Fallback (used if crew not found in crew_models) ─────────────────────────
llm_fallback:
  model: llama3.1:8b

crew:
  process: sequential         # sequential | hierarchical
  verbose: true
  max_rpm: 10                 # max requests/min to Ollama (throttle for stability)
  output_dir: outputs         # relative to smith_agentic/
  hitl: true                  # human-in-the-loop plan approval (--no-hitl to skip)
  target_repo: null           # absolute path to external repo agents can read/write directly
                              # override at runtime with --target-repo /path/to/repo

memory:
  persist_dir: memory/chroma  # ChromaDB persistent storage (relative to smith_agentic/)
  collection: smith_agentic_memory    # ChromaDB collection name
  enabled: true               # set false to disable memory entirely

# ── Per-agent model routing (Phase 1D) ───────────────────────────────────────
# Each agent can use a different Ollama model. get_agent_model() in loader.py
# resolves these. Falls back to llm_fallback.model if agent not listed.
agent_models:
  orchestrator:        qwen2.5:7b
  researcher:          qwen2.5:7b
  builder:             qwen2.5-coder:7b
  critic:              qwen2.5:7b
  qa_agent:            llama3.1:8b
  security_agent:      qwen2.5:7b
  docs_agent:          llama3.1:8b
  memory_agent:        llama3.1:8b
  deploy_agent:        qwen2.5:7b
  observability_agent: llama3.1:8b
  vision_analyst:      qwen2.5:7b
  vision_reporter:     llama3.1:8b
  vision_qa:           llama3.1:8b

# ── Vision_Inspect backend connection ─────────────────────────────────────────
vision_inspect:
  base_url: http://localhost:8000   # Vision_Inspect FastAPI service
  timeout:  30                      # seconds per API call

# ── External MCP tool servers (OT bridges) ────────────────────────────────────
# Smith_Agentic connects OUT to these MCP servers as a client and exposes their
# tools to the listed crews. READ tools are available by default. WRITE/mutating
# tools (which touch the plant floor) require ALL of:
#   1. allow_writes: true on the server below, AND
#   2. env SMITH_AGENTIC_MCP_ALLOW_WRITES=true, AND
#   3. env SMITH_AGENTIC_MCP_WRITE_TOKEN matching write_token (if one is set).
# This mirrors ignition-mcp's "script execution disabled by default" pattern.
mcp_servers:
  hermes:                           # OPC-UA plant-floor bridge (stdio transport)
    enabled: true
    transport: stdio
    # `command` defaults to the running Python interpreter; override if needed.
    args: ["-m", "hermes_mcp.server"]
    cwd: "../Hermes"                # resolved relative to Smith_Agentic/
    env:
      HERMES_ENDPOINT: "opc.tcp://localhost:4840"
    connect_timeout: 8
    crews: [plc]
    read_tools:  [read_node, read_nodes, browse_nodes, get_server_status, get_node_attributes]
    write_tools: [write_node]
    allow_writes: false
    write_token: ""

  ignition:                         # Ignition SCADA gateway bridge (streamable-http)
    enabled: false                  # off by default: needs a running gateway on :8007
    transport: streamable-http
    url: "http://127.0.0.1:8007/mcp"
    connect_timeout: 8
    crews: [plc]
    read_tools:  [get_gateway_info, get_module_health, get_system_metrics, list_projects,
                  get_project, list_tag_providers, browse_tags, read_tags,
                  get_active_alarms, get_alarm_history, get_tag_history]
    write_tools: [write_tag, create_tags, edit_tags, delete_tags, set_project_resource,
                  delete_project_resource, create_project, delete_project, acknowledge_alarms]
    allow_writes: false
    write_token: ""
